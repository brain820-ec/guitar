<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#4cc2b2"/>
      <stop offset="1" stop-color="#1f6f68"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a340"/>
      <stop offset="1" stop-color="#d9731f"/>
    </linearGradient>
  </defs>

  <!-- background (full-bleed; iOS rounds the corners itself) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- music notes -->
  <g fill="#fff3d6" opacity="0.9">
    <g transform="translate(70 120) rotate(-12)">
      <ellipse cx="0" cy="40" rx="17" ry="12"/>
      <rect x="12" y="-10" width="6" height="50" rx="3"/>
      <path d="M15 -10 q22 8 26 30 q-10 -14 -26 -14 z"/>
    </g>
    <g transform="translate(420 70) rotate(10)">
      <ellipse cx="0" cy="34" rx="14" ry="10"/>
      <ellipse cx="44" cy="26" rx="14" ry="10"/>
      <rect x="10" y="-8" width="5" height="42" rx="2.5"/>
      <rect x="54" y="-16" width="5" height="42" rx="2.5"/>
      <path d="M10 -8 L59 -16 L59 -4 L10 4 z"/>
    </g>
  </g>

  <!-- body -->
  <ellipse cx="256" cy="430" rx="160" ry="130" fill="#8f6e52"/>
  <ellipse cx="256" cy="450" rx="100" ry="85" fill="#a8876a"/>

  <!-- head -->
  <g>
    <!-- shaggy fur outline -->
    <path d="M140 220 q-10 -30 10 -50 q-2 -34 30 -48 q14 -30 50 -30 q26 -18 52 0 q36 0 50 30 q32 14 30 48 q20 20 10 50 q14 40 -16 72 q-12 40 -60 50 q-40 14 -80 0 q-48 -10 -60 -50 q-30 -32 -16 -72 z" fill="#8f6e52"/>
    <!-- face mask -->
    <ellipse cx="256" cy="232" rx="104" ry="86" fill="#efdcbf"/>
    <!-- forehead tuft -->
    <path d="M226 120 q12 -26 30 -4 q12 -24 28 2" fill="none" stroke="#6e523c" stroke-width="7" stroke-linecap="round"/>
    <!-- eye patches (slanting down and out) -->
    <ellipse cx="208" cy="226" rx="40" ry="22" fill="#4b3324" transform="rotate(22 208 226)"/>
    <ellipse cx="304" cy="226" rx="40" ry="22" fill="#4b3324" transform="rotate(-22 304 226)"/>
    <!-- eyes, happy and closed (eyes-shut-rocking-out) -->
    <path d="M196 222 q14 -14 28 0" fill="none" stroke="#fff3e2" stroke-width="7" stroke-linecap="round"/>
    <path d="M288 222 q14 -14 28 0" fill="none" stroke="#fff3e2" stroke-width="7" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="186" cy="268" r="15" fill="#f1a39a" opacity="0.7"/>
    <circle cx="326" cy="268" r="15" fill="#f1a39a" opacity="0.7"/>
    <!-- nose -->
    <ellipse cx="256" cy="256" rx="20" ry="13" fill="#3a2618"/>
    <ellipse cx="250" cy="252" rx="6" ry="3.5" fill="#7a5a44"/>
    <!-- smile -->
    <path d="M226 280 q30 30 60 0" fill="#7a3a2c" stroke="#3a2618" stroke-width="5" stroke-linejoin="round"/>
    <path d="M240 290 q16 10 32 0" fill="#e57a6e"/>
  </g>

  <!-- guitar, tilted with neck up to the right -->
  <g transform="translate(232 412) rotate(-35)">
    <!-- neck + headstock -->
    <rect x="60" y="-13" width="170" height="26" rx="4" fill="#6b3f1f"/>
    <g stroke="#e9d7b5" stroke-width="2.5">
      <line x1="100" y1="-13" x2="100" y2="13"/>
      <line x1="135" y1="-13" x2="135" y2="13"/>
      <line x1="167" y1="-13" x2="167" y2="13"/>
      <line x1="196" y1="-13" x2="196" y2="13"/>
      
    </g>
    <path d="M226 -18 L280 -22 Q288 0 280 22 L226 18 z" fill="#4a2a14"/>
    <g fill="#e9e3d6">
      <circle cx="244" cy="-27" r="6"/><circle cx="264" cy="-28" r="6"/>
      <circle cx="244" cy="27" r="6"/><circle cx="264" cy="28" r="6"/>
    </g>
    <!-- body -->
    <g fill="url(#wood)" stroke="#8a4a18" stroke-width="6">
      <path d="M-120 0 C-120 -78 -60 -84 -30 -62 C-6 -46 10 -50 30 -58 C70 -74 100 -40 100 0 C100 40 70 74 30 58 C10 50 -6 46 -30 62 C-60 84 -120 78 -120 0 z"/>
    </g>
    <!-- sound hole -->
    <circle cx="10" cy="0" r="26" fill="#2b1708" stroke="#6b3f1f" stroke-width="5"/>
    <!-- bridge -->
    <rect x="-82" y="-26" width="14" height="52" rx="4" fill="#4a2a14"/>
    <!-- strings -->
    <g stroke="#f7f1e3" stroke-width="1.8">
      <line x1="-76" y1="-9" x2="278" y2="-9"/>
      <line x1="-76" y1="-3" x2="278" y2="-3"/>
      <line x1="-76" y1="3" x2="278" y2="3"/>
      <line x1="-76" y1="9" x2="278" y2="9"/>
    </g>
  </g>

  <!-- arms -->
  <g fill="none" stroke="#8f6e52" stroke-width="44" stroke-linecap="round">
    <path d="M150 360 Q130 440 214 440"/>   <!-- strumming arm -->
    <path d="M360 356 Q406 350 392 306"/>   <!-- fretting arm -->
  </g>
  <!-- claws -->
  <g fill="none" stroke="#f3e6cf" stroke-width="6" stroke-linecap="round">
    <path d="M228 426 q16 -6 18 -22"/>
    <path d="M232 438 q18 -2 24 -16"/>
    <path d="M230 451 q16 2 24 -8"/>
    <path d="M374 296 q2 -16 16 -18"/>
    <path d="M386 290 q4 -14 18 -14"/>
    <path d="M398 288 q6 -12 18 -8"/>
  </g>
</svg>
